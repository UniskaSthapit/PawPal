# One-click deploy on Render (https://render.com) — "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: pawpal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false   # e.g. https://pawpal.onrender.com
      - key: MONGODB_URI
        sync: false   # MongoDB Atlas connection string (required — Render's disk is wiped on redeploy)
      - key: RESEND_API_KEY
        sync: false   # recommended on Render (SMTP ports are blocked on the free plan)
      - key: MAIL_FROM
        sync: false   # e.g. "PawPal <no-reply@your-domain.com>" on a domain verified in Resend
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ALLOW_DEMO_RESET
        value: false
