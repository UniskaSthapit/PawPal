<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal Admin — Applications</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/shared-nav.css"/>
  <link rel="stylesheet" href="css/shared-footer.css"/>
  <link rel="stylesheet" href="css/nav.css"/>
  <link rel="stylesheet" href="css/sidebar.css"/>
  <link rel="stylesheet" href="css/cards.css"/>
  <link rel="stylesheet" href="css/table.css"/>
  <link rel="stylesheet" href="css/applications-extra.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><link rel="canonical" href="YOUR_CANONICAL_URL">
<meta property="og:title" content="PawPal Admin — Applications"><meta property="og:type" content="website"><meta property="og:image" content="YOUR_OG_IMAGE_URL"><link rel="stylesheet" href="css/pp-system.css">
</head>
<body class="page-admin">

<nav class="pawpal-nav" data-nav="admin"></nav>
<div class="layout">
  <aside data-sidebar="admin" aria-label="Admin navigation"></aside>
  <main id="main">
    <div class="main-inner">
      <div class="top-bar"><h1>Applications</h1><span class="date" id="today"></span></div>

      <div class="status-filter" id="statusChips" role="group" aria-label="Filter by status"></div>

      <div class="table-card">
        <div class="pp-toolbar">
          <input class="pp-input pp-grow" id="appSearch" type="search" placeholder="Search applicant, email or pet" aria-label="Search applications"/>
          <select class="pp-select" id="petFilter" aria-label="Filter by pet"><option value="">All pets</option></select>
          <select class="pp-select" id="sortSel" aria-label="Sort"><option value="newest">Newest first</option><option value="score">Highest AI score</option></select>
        </div>
        <p class="rank-note" id="rankNote" hidden>Applicants for this pet are ranked by AI suitability score (FR-08). Scores support your decision — they don't make it.</p>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Applicant</th><th>Pet</th><th>AI Score</th><th>Submitted</th><th>Status</th><th><span class="sr-only">Action</span></th></tr></thead>
            <tbody id="appBody"><tr><td colspan="6"><div class="skeleton skeleton-line"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<footer data-footer></footer>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/applications.js"></script>
<script src="config.js"></script><script src="js/pp-enhance.js" defer></script></body>
</html>
