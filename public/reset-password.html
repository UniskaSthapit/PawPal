<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal — Choose a new password</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/shared-nav.css"/>
  <link rel="stylesheet" href="css/shared-footer.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><link rel="canonical" href="YOUR_CANONICAL_URL">
<meta property="og:title" content="PawPal — Choose a new password"><meta property="og:type" content="website"><meta property="og:image" content="YOUR_OG_IMAGE_URL"><link rel="stylesheet" href="css/pp-system.css">
</head>
<body>
<nav class="pawpal-nav" data-nav="public"></nav>
<main class="pp-center-main">
  <div class="pp-center-card">
    <div class="pp-center-icon">🔑</div>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters, including a letter and a number.</p>
    <div id="resetAlert" class="pp-alert" hidden role="alert"></div>
    <form id="resetForm" class="pp-left" novalidate>
      <div class="pp-field"><label for="newPw">New password</label><input class="pp-input" id="newPw" type="password" autocomplete="new-password" required/></div>
      <div class="pp-field"><label for="newPw2">Confirm new password</label><input class="pp-input" id="newPw2" type="password" autocomplete="new-password" required/></div>
      <button class="pp-btn pp-btn-primary pp-btn-block" type="submit" id="resetBtn">Update password</button>
    </form>
  </div>
</main>
<footer data-footer></footer>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/reset-password.js"></script>
<script src="config.js"></script><script src="js/pp-enhance.js" defer></script></body>
</html>
