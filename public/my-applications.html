<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal — My applications</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/shared-nav.css"/>
  <link rel="stylesheet" href="css/shared-footer.css"/>
  <link rel="stylesheet" href="css/my-applications.css"/>
  <link rel="stylesheet" href="css/my-applications-extra.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><link rel="canonical" href="YOUR_CANONICAL_URL">
<meta property="og:title" content="PawPal — My applications"><meta property="og:type" content="website"><meta property="og:image" content="YOUR_OG_IMAGE_URL"><link rel="stylesheet" href="css/pp-system.css">
</head>
<body class="page-myapps">

<nav class="pawpal-nav" data-nav="public"></nav>
<div class="app-body">
  <aside class="app-sidebar" data-sidebar="user" aria-label="Account navigation"></aside>
  <main class="app-main" id="main">
    <div class="myapp-top-bar">
      <div>
        <h1>My Applications</h1>
        <p class="myapp-subtitle" id="greeting">🐾 Track your adoption journey — every paw deserves a loving home.</p>
      </div>
      <div class="myapp-stats-strip">
        <div class="myapp-stat"><span class="myapp-stat-num" id="statTotal">–</span><span class="myapp-stat-lbl">Applications</span></div>
        <div class="myapp-stat-div"></div>
        <div class="myapp-stat"><span class="myapp-stat-num" style="color:#5D9B6A" id="statApproved">–</span><span class="myapp-stat-lbl">Approved</span></div>
        <div class="myapp-stat-div"></div>
        <div class="myapp-stat"><span class="myapp-stat-num" style="color:#E65100" id="statProgress">–</span><span class="myapp-stat-lbl">In Progress</span></div>
      </div>
    </div>

    <div class="app-cards" id="appCards">
      <div class="skeleton" style="height:190px;border-radius:18px"></div>
      <div class="skeleton" style="height:190px;border-radius:18px"></div>
    </div>

    <section class="updates-section">
      <div class="updates-head"><h2>Recent updates</h2><button class="pp-link-btn" id="markRead">Mark all as read</button></div>
      <div class="updates-list" id="updatesList"><p class="pp-muted">Loading…</p></div>
    </section>
  </main>
</div>
<footer data-footer></footer>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/my-applications.js"></script>
<script src="config.js"></script><script src="js/pp-enhance.js" defer></script></body>
</html>
