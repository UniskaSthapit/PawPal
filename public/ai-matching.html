<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PawPal — AI pet matching</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/shared-nav.css"/>
  <link rel="stylesheet" href="css/shared-footer.css"/>
  <link rel="stylesheet" href="css/ai-matching.css"/>
  <link rel="stylesheet" href="css/app.css"/>
  <link rel="stylesheet" href="css/pages.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><link rel="canonical" href="YOUR_CANONICAL_URL">
<meta property="og:title" content="PawPal — AI pet matching"><meta property="og:type" content="website"><meta property="og:image" content="YOUR_OG_IMAGE_URL"><link rel="stylesheet" href="css/pp-system.css">
</head>
<body class="page-ai">

<nav class="pawpal-nav" data-nav="public"></nav>

<div class="wizard-body" id="main">

  <!-- LEFT: QUIZ + CHAT -->
  <div class="quiz-panel">
    <div class="paw-decor paw-decor--1" aria-hidden="true">🐾</div>
    <div class="paw-decor paw-decor--2" aria-hidden="true">🐾</div>

    <div class="quiz-header">
      <div class="quiz-ai-label"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
          <path d="M5 18l.75 2.25L8 21l-2.25.75L5 24l-.75-2.25L2 21l2.25-.75L5 18z"/>
        </svg>PawPal AI</div>
      <div class="ai-tabs" role="tablist">
        <button class="ai-tab active" role="tab" aria-selected="true" data-tab="quiz">Quick quiz</button>
        <button class="ai-tab" role="tab" aria-selected="false" data-tab="chat">Chat with AI</button>
      </div>
    </div>

    <!-- QUIZ -->
    <section id="quizView">
      <div class="quiz-step-row"><span class="quiz-step" id="stepLabel">Step 1 of 6</span></div>
      <div class="quiz-progress-wrap"><div class="quiz-progress-fill" id="progressFill" style="width:16.6%"></div></div>
      <div id="questionHost" aria-live="polite"></div>
      <div class="quiz-nav">
        <button class="pp-btn pp-btn-ghost" id="backBtn" disabled>Back</button>
        <button class="pp-btn pp-btn-primary" id="nextBtn">Next</button>
      </div>
    </section>

    <!-- CHAT (FR-10) -->
    <section id="chatView" hidden>
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="chat-suggest" id="chatSuggest">
        <button data-say="I live in a small apartment and work full time">Small apartment, work full time</button>
        <button data-say="We have a house with a yard and two young kids">House, yard and kids</button>
        <button data-say="I love hiking and want an active dog">Active, loves hiking</button>
        <button data-say="I'd like a calm cat that is fine alone">Calm cat</button>
      </div>
      <form class="chat-form" id="chatForm">
        <input class="pp-input" id="chatInput" placeholder="Tell PawPal AI about your home and lifestyle…" autocomplete="off" aria-label="Message PawPal AI" maxlength="600"/>
        <button class="pp-btn pp-btn-primary" type="submit" id="chatSend">Send</button>
      </form>
    </section>
  </div>

  <!-- RIGHT: LIVE RESULTS -->
  <div class="results-panel">
    <div class="results-hero" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?crop=entropy&cs=tinysrgb&fit=crop&fm=jpg&q=70&w=600&h=180" alt="" onerror="this.remove()"/>
      <div class="results-hero-overlay"></div>
      <div class="results-hero-text">
        <span class="results-live-pill">🐾 Live Matching</span>
        <h3>Your Top 3 Matches</h3>
        <p id="resultsSub">Updated in real time as you answer</p>
      </div>
    </div>

    <div class="ai-rec-box">
      <div class="ai-rec-icon" aria-hidden="true"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
        </svg></div>
      <p id="aiRec">Answer a few questions and we'll suggest pets that suit your home.</p>
    </div>

    <div class="match-cards" id="matchCards"></div>

    <a class="btn-view-matches" id="viewAll" href="home.html#pets">Browse all pets</a>
  </div>
</div>

<footer data-footer></footer>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/ai-matching.js"></script>
<script src="config.js"></script><script src="js/pp-enhance.js" defer></script></body>
</html>
